name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same ref when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Same script developers run via the pre-commit hook —
      # gofmt + go vet + go build + go test ./... — so local cleanliness
      # implies CI cleanliness.
      - run: ./scripts/pre-commit.sh
