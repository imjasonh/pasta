enabled: Yes # want "non-canonical boolean; use `true`"
debug: True # want "non-canonical boolean; use `true`"
verbose: ON # want "non-canonical boolean; use `true`"
disabled: No # want "non-canonical boolean; use `false`"
deprecated: Off # want "non-canonical boolean; use `false`"
ok: true
ok2: false

scalar: ["a", on, off, "b"] # want "non-canonical boolean; use `true`" # want "non-canonical boolean; use `false`"

# `on:` as a key is valid YAML (GitHub Actions uses it for trigger
# definitions). Keys must NOT be flagged — only values.
on:
  push:
    branches: [main]
  yes:
    nested: true
